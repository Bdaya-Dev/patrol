name: Publish to pub.dev

on:
  push:
    tags:
      - '*-v[0-9]+.[0-9]+.[0-9]+*'
  # Manual escape hatch: a locally-pushed release tag (created outside of a
  # GitHub Actions run -- e.g. release-prepare.yml's own `melos exec ... git
  # tag` step reliably fails with "tag already exists" because
  # $MELOS_PACKAGE_VERSION there still resolves to the PRE-bump version, so
  # the actual tag+push has historically needed a manual follow-up) does not
  # always reach GitHub's tag-push event pipeline promptly. Dispatch this
  # manually against the release tag ref (`--ref <package>-v<version>`) as a
  # deterministic fallback when a pushed tag doesn't trigger a run.
  workflow_dispatch: {}

permissions:
  # `contents: write` is required by melos-action's `create-release: true`
  # step (softprops/action-gh-release). With `contents: read` it fails with
  # "Resource not accessible by integration" AFTER the package is already
  # published to pub.dev, marking an otherwise-successful publish run as failed.
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: bluefireteam/melos-action@v3
        with:
          publish: true
          create-release: true

name: Prepare Release

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Skip if this push is a release PR's own merge, or one is already open
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        # Commit-message matching is NOT reliable here: this repo's squash
        # setting is `squash_merge_commit_title: COMMIT_OR_PR_TITLE`, so the
        # merge commit only gets the PR title when the PR has >1 commit; the
        # common case (melos-action's create-pr producing a single commit)
        # gives the merge commit that commit's own message instead (verified
        # against all 6 past release merges: 5 of 6 do NOT start with
        # "chore(release): Publish packages"). Query the PR API by merge-commit
        # SHA and head-branch prefix instead -- structural data, not prose.
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            prs_json=$(gh pr list --repo "${{ github.repository }}" --state merged --base master --limit 10 --json headRefName,mergeCommit)
            is_release_merge=$(echo "$prs_json" | jq --arg sha "$PUSH_SHA" \
              '[.[] | select(.mergeCommit.oid == $sha and (.headRefName | startswith("release-")))] | length')
            if [ "$is_release_merge" -gt 0 ]; then
              echo "This push is a release PR's own merge commit ($PUSH_SHA); skipping."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          open_count=$(gh pr list --repo "${{ github.repository }}" --search "chore(release)" --state open --json number --jq 'length')
          if [ "$open_count" -gt 0 ]; then
            echo "A release PR is already open; skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  version:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: bluefireteam/melos-action@v3
        with:
          run-versioning: true
          # NOTE: `publish-dry-run` is intentionally NOT set here. melos-action
          # runs `melos publish -y --dry-run` AFTER `melos version` rewrites each
          # package's pubspec.yaml + CHANGELOG.md but BEFORE those edits are
          # committed (the create-pr step commits them later). `dart pub publish
          # --dry-run` then emits a "checked-in files are modified in git"
          # warning and, in non-interactive mode (`-y`), exits 65 — aborting the
          # whole prepare run. The real publish validation happens in publish.yml
          # (triggered by the version tag), so the dry-run here is both redundant
          # and structurally guaranteed to fail.
          create-pr: true
          # `tag: false`: melos-action tags the LOCAL pre-merge version-bump
          # commit, which never exists on master once this PR is squash-merged
          # -- an orphaned tag. release-tag.yml tags the real post-merge commit
          # instead, once the version-bump PR actually lands.
          tag: false
          git-email: ahmednfwela@digrum.com
          git-name: ahmednfwela

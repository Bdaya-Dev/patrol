name: Tag Release

# Runs after a version-bump PR (opened by release-prepare.yml) is merged to
# master. Tags each publishable package at its current pubspec.yaml version,
# against the REAL post-merge commit -- unlike melos-action's own `tag: true`,
# which would tag the local pre-merge commit that becomes unreachable from
# master once the PR merges. publish.yml then fires on the pushed tag and
# publishes to pub.dev.
#
# Triggered on `pull_request: closed` rather than on push + commit-message
# matching: this repo's squash setting is `squash_merge_commit_title:
# COMMIT_OR_PR_TITLE`, so the merge commit only carries the PR title when the
# PR has more than one commit -- the common case (melos-action's create-pr
# step producing a single commit) gives the merge commit that commit's own
# message instead ("[create-pull-request] automated change"), which never
# matches. Verified against all 6 past release merges: only 1 of 6 actual
# merge-commit messages started with "chore(release): Publish packages". The
# PR's own headRefName (melos-action creates branches named `release-<run_id>`
# -- verified across all 6) is structural data from the PR object, not prose,
# so it doesn't have this problem.

on:
  pull_request:
    types: [closed]
    branches:
      - master

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release-')
    steps:
      - uses: actions/checkout@v6
        with:
          # The actual commit that landed on master (squash or merge commit),
          # not the ephemeral PR merge-preview ref actions/checkout defaults
          # to for pull_request events.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "ahmednfwela@digrum.com"
          git config user.name "ahmednfwela"

      - name: Tag published packages
        run: |
          set -euo pipefail
          for pubspec in packages/*/pubspec.yaml; do
            if grep -qE '^publish_to:[[:space:]]*none' "$pubspec"; then
              continue
            fi
            name=$(grep -m1 -E '^name:' "$pubspec" | sed -E 's/^name:[[:space:]]*//')
            version=$(grep -m1 -E '^version:' "$pubspec" | sed -E 's/^version:[[:space:]]*([0-9][^[:space:]#]*).*/\1/')
            tag="${name}-v${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "Tag ${tag} already exists, skipping."
              continue
            fi
            echo "Creating and pushing tag ${tag}"
            git tag -a "${tag}" -m "${tag}"
            git push origin "refs/tags/${tag}"
          done

name: apache_notice
description: >-
  Apache-2.0 §4(b) compliance tool for the patrol fork: verifies and inserts
  "changed file" notices, and generates NOTICE.md files.
publish_to: none
environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  args: ^2.5.0
  path: ^1.9.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
